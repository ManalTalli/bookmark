<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>

    <form class="bookMarkForm w-50 m-auto py-5">
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="floatingInput" placeholder="Enter site name ">
            <label for="floatingInput">Site name</label>
            <span class="nameError"></span>
        </div>
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="floatingInput" placeholder="Enter site URL ">
            <label for="floatingInput">Site URL</label>
            <span class="urlError"></span>
        </div>
        <div class="form-floating mb-3">
            <input type="email" class="form-control" id="floatingInput" placeholder="Enter your email">
            <label for="floatingInput">User email</label>
                        <span class="emailError"></span>

        </div>
        <div class="form-floating mb-3">
            <input type="password" class="form-control" id="floatingInput" placeholder="Enter your password ">
            <label for="floatingInput">User password</label>
                        <span class="passError"></span>

        </div>

        <div class="form-floating mb-3">
            <button class="btn btn-outline-success" type="submit">Save</button>
        </div>
         <div class="form-floating mb-3">
            <button class="btn btn-outline-success deleteAll">delete</button>
        </div>
    </form>

    <table class="table">
        <thead>
            
                <td>Site name</td>
                <td>Site URL</td>
                <td>Email</td>
                <td>Password</td>                
            
        </thead>
        <tbody class="sitesData">

        </tbody>
    </table>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
